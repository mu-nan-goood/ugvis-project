[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore:datetime\.datetime\.utcfromvalue.*:DeprecationWarning
    ignore:datetime\.datetime\.utcnow.*:DeprecationWarning
    ignore:The 'app' parameter is deprecated.*:DeprecationWarning
