version: '3.8'
# UGVIS Docker Compose — PostgreSQL 生产部署
# 注意：开发环境/SQLite 方案请使用根目录 docker-compose.yml
# 两套配置互斥，请勿同时运行
services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: ugvis
      POSTGRES_PASSWORD: ugvis123
      POSTGRES_DB: ugvis_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugvis"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    environment:
      DATABASE_URL: postgresql+psycopg2://ugvis:ugvis123@db:5432/ugvis_db
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ../data:/data
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    command: npm run dev -- --host

volumes:
  postgres_data:
