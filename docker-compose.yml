# UGVIS Docker Compose — SQLite 开发部署（单机快速启动）
# 注意：生产环境/PostgreSQL 方案请使用 docker/docker-compose.yml
# 两套配置互斥，请勿同时运行
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ugvis-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/ugvis.db
      - OPENCLAW_URL=http://openclaw:28789
      - OPENCLAW_TOKEN=${OPENCLAW_TOKEN:-}
      - OPENCLAW_TIMEOUT=120
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://frontend:80"]
    volumes:
      - ./data:/app/data
    networks:
      - ugvis-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ugvis-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    networks:
      - ugvis-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  ugvis-network:
    driver: bridge